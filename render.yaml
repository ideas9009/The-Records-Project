services:
  - type: web
    name: the-records-project-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: the-records-project-plus
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: ALLOWED_ORIGINS
        value: http://127.0.0.1:1420,http://localhost:1420,http://tauri.localhost,https://tauri.localhost
